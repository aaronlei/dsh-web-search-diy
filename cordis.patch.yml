# dsh-web-search-diy bundle patch — automatically applied when this package
# is added as a profile bundle (e.g. `dsh plugin add dsh-web-search-diy`).
#
# It registers the OpenAI-compatible search provider (plus the web
# configuration endpoint on web profiles) and switches the shared `web`
# service's default search provider to it. Because bundle patches apply after
# the shipped base layers (last write wins per row id), this overrides the
# base search-provider default without touching any shipped file.

- insert:
    - id: web-search-diy
      name: 'dsh-web-search-diy'

# Whole-config replacement of the base `web` row: this patch layer replaces the
# row's entire `config`, so every key the deployment needs must be restated
# (the base also ships `fetchProvider: http`; dropping it here would leave
# fetch without a provider). No profile-level patch is required.
- id: web
  config:
    searchProvider: diy-search
    fetchProvider: http

# The shipped legacy Messages search is replaced by this plugin; keep that
# base row disabled so it never registers a competing `deepseek-official`
# provider. 0.2.2-rc.3's `web-deepseek-api` (deepseek-search-api +
# deepseek-fetch-api) stays enabled: the `web` row above pins diy-search and
# http by default, while both official APIs remain selectable in the Web
# search and fetch settings page.
- id: web-search-deepseek
  disabled: true